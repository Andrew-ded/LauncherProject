appId: local.andrei.project-launcher
productName: Project Launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: portable
      arch: [x64]
  # Свою иконку положи в build/icon.ico (256×256) — подхватится автоматически
portable:
  artifactName: ProjectLauncher-${version}-portable.exe
